<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testing Centers</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
    }

    .testing-centers-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Logos Grid */
    .logos-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      margin-bottom: 50px;
    }

    .logo-item {
      flex: 1 1 250px;
      max-width: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .logo-item img {
      max-width: 100%;
      height: auto;
      max-height: 130px;
      object-fit: contain;
    }

    /* Button Styling */
    .btn-examenes {
      background-color: #ff6b00; /* Orange color from image */
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(255, 107, 0, 0.2);
    }

    .btn-examenes:hover {
      background-color: #e05e00;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <section class="testing-centers-section">
    <!-- Logos Section -->
    <div class="logos-container">
      
      <!-- Kryterion Logo -->
      <div class="logo-item">
        <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Centro-Examenes/kryterion.png?ver=9uWG12NyCx9RM7m-Ph8KFw%3d%3d" alt="Kryterion Authorized Testing Center">
      </div>

      <!-- Pearson VUE Logo -->
      <div class="logo-item">
        <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Centro-Examenes/pearson%20VEU.png?ver=yEwBOLmNboxwcrZ5tlN6pw%3d%3d" alt="Pearson VUE Authorized Test Center">
      </div>

      <!-- PSI Logo -->
      <div class="logo-item">
        <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Centro-Examenes/PSI.png?ver=YWeKQUzaPJ3AVAvnWYTlOg%3d%3d" alt="PSI Authorized Test Center">
      </div>

    </div>

    <!-- Button Section -->
    <a href="#" class="btn-examenes">LISTA DE EXÁMENES</a>
  </section>

</body>
</html>
