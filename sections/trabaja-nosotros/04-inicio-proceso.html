<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulación - New Horizons</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Contenedor Banner de Postulación */
        .apply-banner {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 400px;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Imagen de fondo con filtro morado/azulado súper puesto */
            background: 
            url('https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Trabaja-Nosotros/Postulate%20banner.png?ver=RvjFfMPvZmVO5pAWo3omwA%3d%3d') no-repeat center center / cover;
            padding: 60px 20px;
            text-align: center;
        }

        /* Contenido Centrado */
        .apply-content {
            max-width: 750px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Título del Banner */
        .apply-title {
            color: #ffffff;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        /* Descripción */
        .apply-description {
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        /* Botón Naranja */
        .apply-btn {
            display: inline-block;
            background-color: #ff6c00; /* Naranja New Horizons */
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            padding: 12px 42px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 15px rgba(255, 108, 0, 0.3);
            border: none;
            cursor: pointer;
        }

        .apply-btn:hover {
            background-color: #e56000;
            transform: translateY(-2px);
            box-shadow: 0px 6px 20px rgba(255, 108, 0, 0.4);
        }

        /* Adaptabilidad Móvil */
        @media (max-width: 768px) {
            .apply-banner {
                min-height: auto;
                padding: 40px 20px;
                border-radius: 12px;
            }

            .apply-title {
                font-size: 24px;
            }

            .apply-description {
                font-size: 14px;
            }

            .apply-btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- Sección del Banner de Postulación -->
    <section class="apply-banner">
        <div class="apply-content">
            <h2 class="apply-title">Inicia tu proceso de postulación</h2>
            <p class="apply-description">
                Completa el formulario con tu información personal y adjunta tu currículum vitae. Nuestro equipo evaluará tu perfil y se pondrá en contacto contigo en caso de cumplir con los requisitos de alguna vacante disponible.
            </p>
            <a href="#" class="apply-btn">Postular</a>
        </div>
    </section>

</body>

</html>
