<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conoce nuestra sede</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
    }

    .headquarters-section {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
      text-align: center;
    }

    /* Título Principal */
    .headquarters-title {
      color: #2c2a6b;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    /* Subtítulo */
    .headquarters-subtitle {
      color: #2c2a6b;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 35px;
    }

    /* Contenedor de la Imagen */
    .image-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      line-height: 0; /* Elimina espacio en blanco inferior en etiquetas img */
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Responsivo para móviles */
    @media (max-width: 768px) {
      .headquarters-section {
        padding: 30px 15px;
      }

      .headquarters-title {
        font-size: 26px;
      }

      .headquarters-subtitle {
        font-size: 15px;
        margin-bottom: 25px;
      }

      .image-container {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>

  <section class="headquarters-section">
    <!-- Encabezados -->
    <h2 class="headquarters-title">Conoce nuestra sede</h2>
    <p class="headquarters-subtitle">Visítanos en New Horizons Perú</p>

    <!-- Imagen de la sede -->
    <div class="image-container">
      <!-- Reemplaza el enlace entre comillas en src con el enlace directo de tu imagen -->
      <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/fachadanh.png?ver=ZekcpuuSTljKWb7xxrpCDA%3d%3d" alt="Sede New Horizons Perú">
    </div>
  </section>

</body>
</html>
