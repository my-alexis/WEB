<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto NH</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: #2c2a6b;
        }

        /* Sección Principal */
        .contact-section {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 20px 20px;
            text-align: center;
        }

        .contact-title {
            color: #2c2a6b;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contact-subtitle {
            color: #2c2a6b;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        .contact-subtitle strong {
            font-weight: 700;
        }

        /* Tarjeta Blanca Flotante */
        .contact-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 35px 40px 30px 40px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 650px;
            margin: 0 auto;
            text-align: left;
        }

        /* Rejilla de Información de Contacto */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px 20px;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .info-item.full-width {
            grid-column: span 2;
        }

        .info-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .info-icon img {
            width: 130%;
            height: 130%;
            object-fit: contain;
        }

        .info-text {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: #2c2a6b;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
        }

        .info-value {
            color: #2c2a6b;
            font-size: 13.5px;
            font-weight: 400;
            line-height: 1.3;
            margin-top: 2px;
            text-decoration: none;
        }

        .info-value:hover {
            text-decoration: underline;
        }

        /* Redes Sociales */
        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            padding-top: 10px;
        }

        .social-link img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .social-link:hover img {
            transform: translateY(-3px);
        }

        /* Línea Divisoria Inferior Centrada al 60% */
        .bottom-divider {
            width: 60%;
            height: 1px;
            background-color: #e0e0e0;
            border: none;
            margin: 30px auto 0 auto;
        }

        /* Adaptabilidad Móvil */
        @media (max-width: 600px) {
            .contact-title {
                font-size: 24px;
            }

            .contact-subtitle {
                font-size: 14px;
            }

            .contact-card {
                padding: 25px 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .info-item.full-width {
                grid-column: span 1;
            }

            .bottom-divider {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <section class="contact-section">
        <!-- Título y Subtítulo -->
        <h2 class="contact-title">Estamos aquí para ayudarte</h2>
        <p class="contact-subtitle">Comunícate con nuestro equipo <strong>a través del canal que prefieras</strong></p>

        <!-- Tarjeta Flotante -->
        <div class="contact-card">
            <div class="info-grid">
                <!-- Teléfono -->
                <div class="feature-item info-item">
                    <div class="info-icon">
                        <!-- Remplaza src por la URL de tu icono de teléfono -->
                        <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/icono%20telf.png?ver=5G1xXi40uYWNCNrucyDNTA%3d%3d" alt="Teléfono">
                    </div>
                    <div class="info-text">
                        <span class="info-label">Teléfono</span>
                        <a href="tel:+51940068987" class="info-value">+51 940 068 987</a>
                    </div>
                </div>

                <!-- Correo Electrónico -->
                <div class="feature-item info-item">
                    <div class="info-icon">
                        <!-- Remplaza src por la URL de tu icono de correo -->
                        <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/email%201.png?ver=VDzXDplA6y5pAHe_HQg7eQ%3d%3d" alt="Correo electrónico">
                    </div>
                    <div class="info-text">
                        <span class="info-label">Correo electrónico</span>
                        <a href="mailto:info@newhorizons.edu.pe" class="info-value">info@newhorizons.edu.pe</a>
                    </div>
                </div>

                <!-- Dirección -->
                <div class="feature-item info-item full-width">
                    <div class="info-icon">
                        <!-- Remplaza src por la URL de tu icono de ubicación -->
                        <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/lugar.png?ver=ZdLPjx8NzXrf2PjAuqAI6w%3d%3d" alt="Dirección">
                    </div>
                    <div class="info-text">
                        <span class="info-label">Dirección</span>
                        <span class="info-value">Av. Santa Cruz 870, Miraflores, Lima, Perú.</span>
                    </div>
                </div>
            </div>

            <!-- Redes Sociales -->
            <div class="social-links">
                <a href="#" class="social-link" target="_blank" title="Facebook">
                    <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/fb.png?ver=im2RQFCF9iAzvfMqd5ucgQ%3d%3d"alt="Facebook">
                <a href="#" class="social-link" target="_blank" title="LinkedIn">
                    <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/link.png?ver=U1TXINUzN4vIu_Ex8jNUCg%3d%3d" alt="LinkedIn">
                </a>
                <a href="#" class="social-link" target="_blank" title="Instagram">
                    <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/ig.png?ver=kTrsnOkjTB391TmzwAxnlg%3d%3d" alt="Instagram">
                </a>
                <a href="#" class="social-link" target="_blank" title="TikTok">
                    <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/tiktok.png?ver=YIvJCF1BJdS_HwjMZiuEaA%3d%3d" alt="TikTok">
                </a>
                <a href="#" class="social-link" target="_blank" title="YouTube">
                    <img src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Contactate-Nosotros/yout.png?ver=0EAfTiXgA_dClzCqiZQyYA%3d%3d" alt="YouTube">
                </a>
            </div>
        </div>
    </section>

    <!-- Línea divisoria inferior de 60% centrada -->
    <hr class="bottom-divider">

</body>
</html>
