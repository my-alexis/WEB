<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubicación - New Horizons Perú</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
    }

    .location-section {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Línea superior divisora */
    .top-divider {
      width: 100%;
      height: 1px;
      background-color: #e0e0e0;
      border: none;
      margin-bottom: 40px;
    }

    /* Título de la sección */
    .location-title {
      color: #2c2a6b;
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 35px;
      line-height: 1.2;
    }

    /* Contenedor del Mapa */
    .map-container {
      width: 100%;
      height: 450px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Responsivo para celulares */
    @media (max-width: 768px) {
      .location-title {
        font-size: 24px;
        margin-bottom: 25px;
      }

      .map-container {
        height: 350px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>

  <section class="location-section">
    
    <!-- Línea divisora superior -->
    <hr class="top-divider">

    <!-- Título principal -->
    <h2 class="location-title">New Horizons Perú</h2>

    <!-- Contenedor del Mapa -->
    <div class="map-container">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3901.0083655674084!2d-77.0381645!3d-12.111579599999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c889c88688f1%3A0x2b890d58d68cc1d2!2sNew%20Horizons%20Per%C3%BA!5e0!3m2!1ses-419!2spe!4v1793371343473!5m2!1ses-419!2spe" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>

  </section>

</body>
</html>
