<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
    .nh-clients-section { max-width: 1100px; margin: 0 auto; text-align: center; padding: 40px 20px; font-family: 'Poppins', sans-serif !important; }
    .nh-clients-section * { font-family: 'Poppins', sans-serif !important; box-sizing: border-box; }
    .nh-clients-title { font-size: 2.3rem; font-weight: 600; color: #232c51; margin: 0 0 12px 0; }
    .nh-clients-title strong { font-weight: 800; color: #1e1b4b; }
    .nh-clients-subtitle { font-size: 1.1rem; color: #2b3660; max-width: 750px; margin: 0 auto 40px auto; }
    .nh-clients-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; max-width: 960px; margin: 0 auto; }
    .nh-client-card {
        background: #ffffff; border-radius: 18px; padding: 24px 20px; height: 110px;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    .nh-client-card img { max-width: 85%; max-height: 75px; object-fit: contain; }
    .nh-section-divider { margin-top: 60px; border: 0; height: 1px; background: #e2e8f0; width: 90%; margin-left: auto; margin-right: auto; }
    @media (max-width: 850px) { .nh-clients-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 550px) { .nh-clients-grid { grid-template-columns: 1fr; } }
</style>

<section class="nh-clients-section">
    <h2 class="nh-clients-title">Empresas que capacitan a<br>sus colaboradores <strong>con nosotros</strong></h2>
    <p class="nh-clients-subtitle">Compañías de 30 a 100,000+ colaboradores de múltiples industrias nos eligen para potenciar su productividad.</p>
    <div class="nh-clients-grid">
        <div class="nh-client-card"><img alt="MINEDU" src="https://www.newhorizons.edu.pe/portals/6/PORTAL%202027/EMPRESAS/MINEDU.png?ver=_cnir7ik09TW-OrAl6NkPQ%3d%3d"></div>
        <div class="nh-client-card"><img alt="Marina de Guerra" src="https://www.newhorizons.edu.pe/portals/6/PORTAL%202027/EMPRESAS/MARINA%20DE%20GUERRA.png?ver=EwbxnBjzNMRMikg3821B0w%3d%3d"></div>
        <div class="nh-client-card"><img alt="Caja Huancayo" src="https://www.newhorizons.edu.pe/portals/6/PORTAL%202027/EMPRESAS/CAJA%20HUANCAYO.png?ver=cW9GaA7BtQgiNKy6jin8Sg%3d%3d"></div>
        <div class="nh-client-card"><img alt="Derrama Magisterial" src="https://www.newhorizons.edu.pe/portals/6/PORTAL%202027/EMPRESAS/DERRAMA.png?ver=yt3010PSzlU_GeYPC_3gyg%3d%3d"></div>
        <div class="nh-client-card"><img alt="Banco de la Nación" src="https://www.newhorizons.edu.pe/portals/6/PORTAL%202027/EMPRESAS/BANCO%20DE%20LA%20NACION.png?ver=xAwHAqREQb_bHxzIq_WbAw%3d%3d"></div>
        <div class="nh-client-card"><img alt="Supermercados Peruanos" src="https://www.newhorizons.edu.pe/portals/6/PORTAL%202027/EMPRESAS/SUPERMERCADOS%20PERUANOS.png?ver=VRrPbOM7h1ka90-cTxDJ9w%3d%3d"></div>
    </div>
    <hr class="nh-section-divider">
</section>
