<style>
    .nh-talent-section, .nh-talent-section * { font-family: 'Poppins', sans-serif !important; box-sizing: border-box; }
    .nh-talent-section { padding: 50px 20px; background-color: #ffffff; max-width: 960px; margin: 0 auto; width: 100%; }
    .nh-talent-header { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; text-align: center; padding: 10px 40px; }
    .nh-talent-header-content { display: flex; flex-direction: column; align-items: center; }
    .nh-talent-title { font-size: clamp(2rem, 3.5vw, 2.7rem); font-weight: 800; color: var(--nh-azul, #2b2a6e); margin: 0 0 4px 0; }
    .nh-talent-subtitle { font-size: clamp(1rem, 1.5vw, 1.2rem); color: #2b2a6e; margin: 0; }
    .nh-talent-toggle-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; }
    .nh-talent-arrow-icon { width: 26px; height: 26px; stroke: #2b2a6e; stroke-width: 2.5; fill: none; transition: transform 0.4s ease; }
    .nh-talent-section.open .nh-talent-arrow-icon { transform: rotate(180deg); }
    .nh-talent-form-wrapper { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.5s ease, opacity 0.4s ease; margin-top: 0; }
    .nh-talent-section.open .nh-talent-form-wrapper { max-height: 1200px; opacity: 1; margin-top: 45px; }
    .nh-talent-form { display: flex !important; flex-wrap: wrap !important; justify-content: space-between; gap: 22px 0; width: 100%; }
    .nh-talent-col-6 { width: 48.5%; }
    .nh-talent-col-12 { width: 100%; }
    .nh-talent-input {
        width: 100%; height: 52px; padding: 12px 28px; border: 1.2px solid #3b3a72;
        border-radius: 50px; font-size: 0.9rem; color: #2b2a6e; outline: none; background-color: #ffffff;
    }
    .nh-talent-input::placeholder { color: #2b2a6e; opacity: 0.85; }
    textarea.nh-talent-input { height: auto; min-height: 200px; border-radius: 26px; padding: 22px 28px; resize: vertical; }
    .nh-talent-submit-container { width: 100%; text-align: center; margin-top: 25px; }
    .nh-talent-submit-btn {
        background-color: #2b2a6e; color: #ffffff; font-size: 0.88rem; font-weight: 700;
        padding: 14px 48px; border: none; border-radius: 12px; cursor: pointer; text-transform: uppercase;
    }
    @media (max-width: 767px) { .nh-talent-col-6 { width: 100%; } }
</style>

<div class="nh-talent-section" id="nhTalentSection">
    <div class="nh-talent-header" id="nhTalentHeader">
        <div class="nh-talent-header-content">
            <h2 class="nh-talent-title">Impulsa el talento con nosotros</h2>
            <p class="nh-talent-subtitle">Capacitación para <strong>profesionales, equipos y organizaciones</strong></p>
        </div>
        <button class="nh-talent-toggle-btn" type="button" aria-label="Desplegar formulario">
            <svg class="nh-talent-arrow-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
    </div>
    <div class="nh-talent-form-wrapper">
        <div class="nh-talent-form" id="nhTalentForm">
            <div class="nh-talent-col-6"><input class="nh-talent-input" name="nombre" placeholder="Nombre y apellido" required type="text"></div>
            <div class="nh-talent-col-6"><input class="nh-talent-input" name="empresa" placeholder="Empresa" required type="text"></div>
            <div class="nh-talent-col-6"><input class="nh-talent-input" name="telefono" placeholder="Teléfono" required type="tel"></div>
            <div class="nh-talent-col-6"><input class="nh-talent-input" name="correo" placeholder="Correo electrónico" required type="email"></div>
            <div class="nh-talent-col-12"><input class="nh-talent-input" name="region_pais" placeholder="Region / Pais" required type="text"></div>
            <div class="nh-talent-col-12"><textarea class="nh-talent-input" name="mensaje" placeholder="Mensaje" required></textarea></div>
            <div class="nh-talent-submit-container"><button class="nh-talent-submit-btn" id="nhTalentSubmit" type="button">ENVIAR</button></div>
        </div>
    </div>
</div>

<script>
(function() {
    var talentSection = document.getElementById('nhTalentSection');
    var talentHeader = document.getElementById('nhTalentHeader');
    var submitBtn = document.getElementById('nhTalentSubmit');
    if (talentHeader && talentSection) {
        talentHeader.addEventListener('click', function() { talentSection.classList.toggle('open'); });
    }
    if (submitBtn) {
        submitBtn.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Gracias, hemos recibido tu mensaje.');
        });
    }
})();
</script>
