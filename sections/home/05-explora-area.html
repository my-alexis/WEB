<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

.nh-explore-section {
    padding: 60px 8%;
    background: #f4f6fa;
    text-align: center;
}
.nh-explore-section, .nh-explore-section * {
    font-family: 'Poppins', sans-serif !important;
    box-sizing: border-box;
}
.nh-explore-title {
    margin: 0 0 40px;
    font-size: clamp(1.8rem, 3.4vw, 2.6rem);
    font-weight: 700;
    color: var(--nh-azul, #2b2a6e);
}
.nh-areas-grid {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 24px;
    max-width: 900px;
    margin: 0 auto 50px;
}
.nh-area-card {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    background: #FFFFFF !important;
    padding: 22px 28px !important;
    border-radius: 18px !important;
    text-decoration: none !important;
    box-shadow: 0 10px 25px rgba(43, 42, 110, 0.07) !important;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    min-height: 80px;
}
.nh-area-card:hover {
    transform: translateY(-4px) !important;
    box-shadow: 0 14px 30px rgba(43, 42, 110, 0.12) !important;
}
.nh-area-card span {
    font-size: clamp(0.95rem, 1.2vw, 1.1rem) !important;
    font-weight: 700 !important;
    color: var(--nh-azul, #2b2a6e) !important;
    text-align: left !important;
    line-height: 1.25 !important;
}
.nh-area-icon {
    width: 32px; height: 32px; min-width: 32px;
    border-radius: 50%; border: 2px solid #f26a0d;
    display: flex; align-items: center; justify-content: center; margin-left: 12px;
}
.nh-area-icon svg { width: 16px; height: 16px; fill: #f26a0d; }

.nh-partners-wrapper { margin-top: 30px; }
.nh-partners-subtitle { font-size: 1.1rem; font-weight: 600; color: #2b2a6e; margin-bottom: 25px; }
.nh-partners-carousel { position: relative; max-width: 1100px; margin: 0 auto; padding: 0 45px; overflow: hidden; }
.nh-partners-viewport { overflow: hidden; width: 100%; }
.nh-partners-track { display: flex; align-items: center; transition: transform 0.5s ease; will-change: transform; }
.nh-partner-item { flex: 0 0 25%; display: flex; align-items: center; justify-content: center; padding: 0 20px; min-height: 100px; box-sizing: border-box; }
.nh-partner-item:not(:last-child) { border-right: 1px solid #d0d4e4; }
.nh-partner-img { max-width: 100%; max-height: 90px; object-fit: contain; filter: grayscale(100%); opacity: 0.85; transition: filter 0.3s ease, opacity 0.3s ease; }
.nh-partner-img:hover { filter: grayscale(0%); opacity: 1; }
.nh-partner-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: #2b2a6e; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
.nh-partner-arrow svg { width: 18px; height: 18px; fill: #FFFFFF; }
.nh-partner-prev { left: 4px; } .nh-partner-next { right: 4px; }
.nh-explore-divider { max-width: 900px; margin: 45px auto 0; border: 0; border-top: 1px solid #e1e5f0; }

@media (max-width: 992px) { .nh-partner-item { flex: 0 0 33.333%; } }
@media (max-width: 768px) {
    .nh-areas-grid { grid-template-columns: 1fr !important; gap: 16px; }
    .nh-partner-item { flex: 0 0 50%; }
}
</style>
