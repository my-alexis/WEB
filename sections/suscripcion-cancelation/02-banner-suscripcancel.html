<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap');

    .nh-suscription-banner {
        position: relative;
        width: 100%;
        min-height: 620px;
        background-image: url('https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/HOME/HAMBURGUESA/Suscription-Cancelation/banner%20canc%20y%20susb.png?ver=FB_PGYJ144sj2umGPzPi2Q%3d%3d');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        padding: 60px 8%;
        box-sizing: border-box;
    }

    .nh-suscription-banner,
    .nh-suscription-banner * {
        font-family: 'Poppins', sans-serif !important;
        box-sizing: border-box;
    }

    .nh-suscription-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        color: #ffffff;
        text-align: left;
        margin-top: 165px;
    }

    .nh-suscription-title {
        font-size: clamp(1.6rem, 3.1vw, 2.6rem);
        font-weight: 700;
        line-height: 1.15;
        margin: 0 0 16px 0;
        color: #ffffff;
    }

    /* Estilo cursivo para la segunda línea del título tal como se ve en la imagen */
    .nh-suscription-title span {
        font-style: italic;
        font-weight: 600;
    }

    .nh-suscription-desc {
        font-size: clamp(0.95rem, 1.2vw, 1.1rem);
        font-weight: 400;
        line-height: 1.5;
        margin: 0 0 30px 0;
        color: #f1f5f9;
        max-width: 650px;
    }

    .nh-suscription-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #22c55e;
        color: #ffffff !important;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        padding: 14px 30px;
        border-radius: 50px;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        transition: background 0.3s ease, transform 0.2s ease;
    }

    .nh-suscription-btn:hover {
        background-color: #16a34a;
        transform: translateY(-2px);
    }

    .nh-suscription-btn svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
    }
</style>

<div class="nh-suscription-banner">
    <div class="nh-suscription-content">
        <h1 class="nh-suscription-title">
            <span>New Horizons Registration /<br>Cancellation Policies</span>
        </h1>
        <p class="nh-suscription-desc">
        </p>
    </div>
</div>
