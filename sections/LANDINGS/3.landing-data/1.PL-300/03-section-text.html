<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  .nhp-benefits,
  .nhp-benefits * {
    box-sizing: border-box;
  }

  .nhp-benefits {
    --nhp-primary: #2b2a6e;
    --nhp-accent: #00b9e8;
    width: 100%;
    max-width: 70%;
    margin: 0 auto;
    padding: 38px 28px 30px;
    background: #fff;
    color: var(--nhp-primary);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  .nhp-benefits__inner {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    position: relative;
    padding: 0 46px;
  }

  .nhp-benefits__heading {
    max-width: 620px;
    margin: 0 auto 34px;
    color: var(--nhp-primary);
    font-size: 28px;
    font-weight: 800;
    line-height: 1.18;
    text-align: center;
  }

  .nhp-benefits__viewport {
    overflow: hidden;
    width: 100%;
  }

  .nhp-benefits__track {
    display: flex;
    width: 100%;
    transition: transform .45s ease;
    will-change: transform;
  }

  .nhp-benefits__slide {
    flex: 0 0 100%;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start;
    gap: 28px;
    padding: 0 8px;
  }

  .nhp-benefits__item {
    min-width: 0;
    min-height: 118px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 9px;
    text-align: center;
  }

  .nhp-benefits__icon-wrap {
    width: 62px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nhp-benefits__icon {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .nhp-benefits__label {
    max-width: 190px;
    margin: 0;
    color: var(--nhp-primary);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.16;
  }

  .nhp-benefits__arrow {
    position: absolute;
    z-index: 2;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background: var(--nhp-primary);
    color: #fff;
    cursor: pointer;
    transition: opacity .2s ease, transform .2s ease;
  }

  .nhp-benefits__arrow:hover {
    opacity: .86;
    transform: translateY(-50%) scale(1.06);
  }

  .nhp-benefits__arrow:focus-visible,
  .nhp-benefits__dot:focus-visible,
  .nhp-benefits__button:focus-visible {
    outline: 3px solid var(--nhp-accent);
    outline-offset: 3px;
  }

  .nhp-benefits__arrow--prev {
    left: 0;
  }

  .nhp-benefits__arrow--next {
    right: 0;
  }

  .nhp-benefits__arrow svg {
    width: 15px;
    height: 15px;
  }

  .nhp-benefits__footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 22px;
  }

  .nhp-benefits__actions {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .nhp-benefits__button {
    min-width: 145px;
    min-height: 38px;
    padding: 10px 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: var(--nhp-primary);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 9px;
    font-weight: 700;
    text-decoration: none;
    transition: background .2s ease, transform .2s ease;
  }

  .nhp-benefits__button:hover {
    background: #1e1d52;
    transform: translateY(-2px);
  }

  .nhp-benefits__pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 12px;
  }

  .nhp-benefits__dot {
    width: 6px;
    height: 6px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #b9bad2;
    cursor: pointer;
    transition: width .2s ease, background .2s ease;
  }

  .nhp-benefits__dot[aria-current="true"] {
    width: 34px;
    height: 2px;
    border-radius: 2px;
    background: var(--nhp-primary);
  }

  @media (max-width: 700px) {
    .nhp-benefits {
      max-width: 100%;
      padding: 34px 14px 26px;
    }

    .nhp-benefits__inner {
      padding: 0 34px;
    }

    .nhp-benefits__heading {
      font-size: 23px;
      margin-bottom: 28px;
    }

    .nhp-benefits__slide {
      gap: 12px;
      padding: 0;
    }

    .nhp-benefits__icon-wrap {
      width: 54px;
      height: 52px;
    }

    .nhp-benefits__label {
      font-size: 11px;
    }

    .nhp-benefits__arrow {
      width: 26px;
      height: 26px;
    }

    .nhp-benefits__footer {
      margin-top: 18px;
    }
  }

  @media (max-width: 420px) {
    .nhp-benefits__inner {
      padding: 0 29px;
    }

    .nhp-benefits__heading {
      font-size: 20px;
    }

    .nhp-benefits__slide {
      gap: 8px;
    }

    .nhp-benefits__item {
      min-height: 112px;
      gap: 8px;
    }

    .nhp-benefits__icon-wrap {
      width: 46px;
      height: 48px;
    }

    .nhp-benefits__label {
      font-size: 10px;
    }

    .nhp-benefits__button {
      min-width: 132px;
      font-size: 8px;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .nhp-benefits__track,
    .nhp-benefits__arrow,
    .nhp-benefits__button,
    .nhp-benefits__dot {
      transition: none;
    }
  }
</style>

<script>
  (() => {
    const section = document.querySelector('#nhp-beneficios-powerbi');
    if (!section || section.dataset.carouselReady === 'true') return;
    section.dataset.carouselReady = 'true';

    const track = section.querySelector('.nhp-benefits__track');
    const slides = Array.from(section.querySelectorAll('.nhp-benefits__slide'));
    const dots = Array.from(section.querySelectorAll('.nhp-benefits__dot'));
    const prev = section.querySelector('.nhp-benefits__arrow--prev');
    const next = section.querySelector('.nhp-benefits__arrow--next');
    let current = 0;

    function showSlide(index) {
      current = (index + slides.length) % slides.length;
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((dot, i) => dot.setAttribute('aria-current', String(i === current)));
    }

    prev.addEventListener('click', () => showSlide(current - 1));
    next.addEventListener('click', () => showSlide(current + 1));
    dots.forEach((dot, i) => dot.addEventListener('click', () => showSlide(i)));

    // Permite cambiar de diapositiva deslizando en pantallas táctiles.
    const viewport = section.querySelector('.nhp-benefits__viewport');
    let touchStartX = 0;
    viewport.addEventListener('touchstart', event => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });
    viewport.addEventListener('touchend', event => {
      const delta = event.changedTouches[0].screenX - touchStartX;
      if (Math.abs(delta) > 45) showSlide(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
  })();
</script>
