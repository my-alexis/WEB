<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:where(.nhf-section) *,
:where(.nhf-section) *::before,
:where(.nhf-section) *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
}

.nhf-section {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;

  --nhp-bg: #ffffff;
  --nhp-heading: #2b2a6e;
  --nhp-text: #2b2a6e;
  --nhp-accent: #FF6B00;
  --nhp-card-bg: #ffffff;
  --nhp-shadow: 0 8px 24px rgba(11, 17, 44, 0.06);

  background-color: var(--nhp-bg);
  padding: 60px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nhf-section .nhp-container {
  max-width: 920px;
  min-width: 0;
  width: 100%;
  margin: 0 auto;
  text-align: center;
}

.nhf-section .nhp-heading {
  color: var(--nhp-heading);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 36px;
}

.nhf-section .nhp-grid {
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 420px));
  justify-content: center;
  gap: 20px 28px;
}

.nhf-section .nhp-card {
  min-width: 0;
  background-color: var(--nhp-card-bg);
  border-radius: 14px;
  box-shadow: var(--nhp-shadow);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
}

.nhf-section .nhp-icon {
  width: 38px;
  height: 38px;
  object-fit: contain;
  flex-shrink: 0;
}

.nhf-section .nhp-divider {
  width: 1.5px;
  height: 34px;
  background-color: var(--nhp-accent);
  flex-shrink: 0;
}

.nhf-section .nhp-label {
  color: var(--nhp-text);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.25;
  text-align: left;
}

@media (max-width: 1024px) {
  .nhf-section .nhp-heading {
    font-size: 28px;
  }

  .nhf-section .nhp-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .nhf-section .nhp-card {
    padding: 18px 20px;
    gap: 14px;
  }

  .nhf-section .nhp-label {
    font-size: 15px;
  }
}

@media (max-width: 600px) {
  .nhf-section {
    padding: 44px 16px;
  }

  .nhf-section .nhp-heading {
    font-size: 23px;
    margin-bottom: 24px;
  }

  .nhf-section .nhp-grid {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .nhf-section .nhp-card {
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 18px;
  }

  .nhf-section .nhp-icon {
    width: 34px;
    height: 34px;
  }

  .nhf-section .nhp-label {
    font-size: 14px;
  }
}
</style>

<section id="nhp-poder" class="nhf-section">
  <div class="nhp-container">
    <h2 class="nhp-heading">¿Qué podrás hacer con Power BI?</h2>
    <div class="nhp-grid">
      <div class="nhp-card">
        <img class="nhp-icon" src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/LANDING/Power-BI/Check.png?ver=IeF9tKuP2Gb8vkjOBPD4sQ%3d%3d" alt="Ícono de verificación con círculo naranja">
        <span class="nhp-divider" aria-hidden="true"></span>
        <span class="nhp-label">Preparar y transformar datos</span>
      </div>
      <div class="nhp-card">
        <img class="nhp-icon" src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/LANDING/Power-BI/Check.png?ver=IeF9tKuP2Gb8vkjOBPD4sQ%3d%3d" alt="Ícono de verificación con círculo naranja">
        <span class="nhp-divider" aria-hidden="true"></span>
        <span class="nhp-label">Visualizar y analizar datos</span>
      </div>
      <div class="nhp-card">
        <img class="nhp-icon" src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/LANDING/Power-BI/Check.png?ver=IeF9tKuP2Gb8vkjOBPD4sQ%3d%3d" alt="Ícono de verificación con círculo naranja">
        <span class="nhp-divider" aria-hidden="true"></span>
        <span class="nhp-label">Modelar información</span>
      </div>
      <div class="nhp-card">
        <img class="nhp-icon" src="https://www.newhorizons.edu.pe/Portals/6/PORTAL%202027/LANDING/Power-BI/Check.png?ver=IeF9tKuP2Gb8vkjOBPD4sQ%3d%3d" alt="Ícono de verificación con círculo naranja">
        <span class="nhp-divider" aria-hidden="true"></span>
        <span class="nhp-label">Gestionar y proteger Power BI</span>
      </div>
    </div>
  </div>
</section>
