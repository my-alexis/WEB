<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap">

<style>
  :where(.nhm-section) *,
  :where(.nhm-section) *::before,
  :where(.nhm-section) *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
  }

  .nhm-section {
    --nhm-primary: #2b2a6e;
    --nhm-orange: #FF6B00;
    --nhm-white: #ffffff;
    --nhm-bg-gradient: linear-gradient(90deg, #26216F 0%, #156DA8 51%, #04B8E1 100%);
    --nhm-card-shadow: 0 12px 32px rgba(11, 17, 44, 0.25);

    width: 100%;
    background: var(--nhm-bg-gradient);
    padding: 64px 24px 72px;
    color: var(--nhm-white);
  }

  .nhm-section .nhm-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .nhm-section .nhm-heading {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    color: var(--nhm-white);
    max-width: 560px;
    margin-bottom: 36px;
  }

  .nhm-section .nhm-stat-card {
    width: 100%;
    background-color: var(--nhm-white);
    border-radius: 18px;
    box-shadow: var(--nhm-card-shadow);
    padding: 28px 44px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nhm-section .nhm-stat-number {
    font-size: 82px;
    font-weight: 800;
    line-height: 1;
    color: var(--nhm-orange);
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }

  .nhm-section .nhm-stat-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nhm-section .nhm-stat-lead {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--nhm-orange);
  }

  .nhm-section .nhm-stat-desc {
    font-size: 13.5px;
    font-style: italic;
    font-weight: 400;
    line-height: 1.45;
    color: var(--nhm-primary);
  }

  .nhm-section .nhm-stat-desc-bold {
    font-weight: 700;
    font-style: italic;
  }

  .nhm-section .nhm-stat-source {
    font-size: 12.5px;
    font-style: italic;
    font-weight: 400;
    color: var(--nhm-primary);
    margin-top: 2px;
    padding-left: 16px;
  }

  @media (max-width: 1024px) {
    .nhm-section {
      padding: 52px 20px 60px;
    }

    .nhm-section .nhm-heading {
      font-size: 28px;
      margin-bottom: 30px;
    }

    .nhm-section .nhm-stat-card {
      padding: 26px 32px;
      gap: 24px;
    }

    .nhm-section .nhm-stat-number {
      font-size: 68px;
    }

    .nhm-section .nhm-stat-lead {
      font-size: 16.5px;
    }
  }

  @media (max-width: 600px) {
    .nhm-section {
      padding: 44px 16px 52px;
    }

    .nhm-section .nhm-heading {
      font-size: 23px;
      margin-bottom: 24px;
    }

    .nhm-section .nhm-stat-card {
      flex-direction: column;
      text-align: center;
      padding: 28px 20px;
      gap: 16px;
    }

    .nhm-section .nhm-stat-number {
      font-size: 64px;
    }

    .nhm-section .nhm-stat-lead {
      font-size: 15.5px;
    }

    .nhm-section .nhm-stat-source {
      padding-left: 0;
    }
  }
</style>

<section id="nhm-mercado-analitico" class="nhm-section">
  <div class="nhm-inner">
    <h2 class="nhm-heading">El mercado necesita profesionales analíticos</h2>

    <div class="nhm-stat-card">
      <span class="nhm-stat-number">70%</span>

      <div class="nhm-stat-body">
        <p class="nhm-stat-lead">de los empleadores consideran esencial el pensamiento analítico.</p>
        <p class="nhm-stat-desc">Desarrolla esta habilidad con <strong class="nhm-stat-desc-bold">Power BI e inteligencia artificial</strong> y transforma datos en decisiones estratégicas.</p>
        <p class="nhm-stat-source">Fuente: World Economic Forum, 2025.</p>
      </div>
    </div>
  </div>
</section>
