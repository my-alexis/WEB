<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .nh-related-section,
  .nh-related-section *,
  .nh-related-section *::before,
  .nh-related-section *::after {
    box-sizing: border-box;
  }

  .nh-related-section {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    overflow: hidden;
    padding: 42px 24px 64px;
    background: #ffffff;
    color: #2b2a6e;
    font-family: 'Poppins', sans-serif;
  }

  .nh-related-section .nh-related-inner {
    width: 100%;
    max-width: 1120px;
    min-width: 0;
    margin: 0 auto;
  }

  .nh-related-section .nh-related-title {
    margin: 0 0 64px;
    color: #2b2a6e;
    font-size: clamp(28px, 3.2vw, 36px);
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
  }

  .nh-related-section .nh-related-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 26px;
    width: 100%;
    max-width: 870px;
    min-width: 0;
    margin: 0 auto;
    align-items: stretch;
  }

  .nh-related-section .nh-related-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    min-width: 0;
    overflow: hidden;
    height: 300px;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    text-align: center;
    text-decoration: none;
    isolation: isolate;
    transition: none;
  }

  .nh-related-section .nh-related-card:hover {
    transform: none;
    box-shadow: none;
    outline: none;
  }

  .nh-related-section .nh-related-card:focus,
  .nh-related-section .nh-related-card:focus-visible {
    outline: none;
  }

  .nh-related-section .nh-related-image {
    position: absolute;
    inset: 0;
    z-index: -1;
    display: block;
    width: 100%;
    height: 103%;
    max-width: 100%;
    object-fit: contain;
    object-position: center;
  }

  .nh-related-card-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    width: 100%;
    min-width: 0;
    min-height: 145px;
    padding: 10px 12px 22px;
    margin-top: auto;
    background: transparent;
  }

  .nh-related-section .nh-related-course-type {
    margin: 0 0 5px;
    color: #2b2a6e;
    font-size: 13px;
    font-style: italic;
    font-weight: 500;
    line-height: 1.3;
  }

  .nh-related-section .nh-related-course-name {
    min-height: 42px;
    margin: 0 0 12px;
    color: #2b2a6e;
    font-size: clamp(13px, 1.35vw, 16px);
    font-weight: 800;
    font-style: italic;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .nh-related-section .nh-related-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 72px;
    padding: 7px 15px;
    border-radius: 6px;
    background: #ff7900;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.3;
    text-decoration: none;
    transition: none;
  }

  .nh-related-section .nh-related-card:hover .nh-related-button {
    background: #ff7900;
  }

  @media (max-width: 760px) {
    .nh-related-section {
      padding: 40px 20px 52px;
    }

    .nh-related-section .nh-related-title {
      margin-bottom: 42px;
    }

    .nh-related-section .nh-related-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      max-width: 620px;
      margin: 0 auto;
    }

    .nh-related-section .nh-related-card {
      height: 350px;
      border-radius: 0;
      box-shadow: none;
    }

    .nh-related-section .nh-related-course-name {
      font-size: 14px;
    }
  }

  @media (max-width: 520px) {
    .nh-related-section {
      padding: 36px 16px 44px;
    }

    .nh-related-section .nh-related-title {
      font-size: 25px;
      margin-bottom: 32px;
    }

    .nh-related-section .nh-related-grid {
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      max-width: 340px;
    }

    .nh-related-section .nh-related-card {
      height: 350px;
      border-radius: 0;
      box-shadow: none;
    }

    .nh-related-section .nh-related-course-name {
      font-size: 15px;
      min-height: 0;
    }
  }
</style>
