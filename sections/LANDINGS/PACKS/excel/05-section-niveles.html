<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">

<style>
  :where(.nhv-section) *,
  :where(.nhv-section) *::before,
  :where(.nhv-section) *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
  }

  .nhv-section {
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    min-width: 0;

    --nhv-primary: #2b2a6e;
    --nhv-overlay-top: rgba(43, 42, 110, 0.08);
    --nhv-overlay-bottom: rgba(43, 42, 110, 0.94);
    --nhv-orange: #FF6B00;
    --nhv-orange-hover: #e55e00;
    --nhv-white: #ffffff;
    --nhv-bg: #ffffff;
    --nhv-divider: #d9dde8;
    --nhv-shadow: 0 10px 26px rgba(43, 42, 110, 0.14);

    background-color: var(--nhv-bg);
    padding: 64px 24px 0;
    color: var(--nhv-primary);
  }

  .nhv-section .nhv-inner {
    width: 100%;
    min-width: 0;
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .nhv-section .nhv-heading {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    color: var(--nhv-primary);
    margin-bottom: 44px;
  }

  .nhv-section .nhv-grid {
    width: 100%;
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: 224px 224px;
    gap: 24px;
    margin-bottom: 68px;
  }

  .nhv-section .nhv-level-card {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--nhv-shadow);
    display: flex;
    align-items: flex-end;
    background-color: var(--nhv-primary);
  }

  .nhv-section .nhv-level-card--basic {
    grid-column: 1;
    grid-row: 1 / span 2;
  }

  .nhv-section .nhv-level-card--intermediate {
    grid-column: 2;
    grid-row: 1;
  }

  .nhv-section .nhv-level-card--advanced {
    grid-column: 2;
    grid-row: 2;
  }

  .nhv-section .nhv-level-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    z-index: 1;
    transition: transform 0.35s ease;
  }

  .nhv-section .nhv-level-card:hover .nhv-level-img {
    transform: scale(1.03);
  }

  .nhv-section .nhv-level-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(43, 42, 110, 0.04) 0%,
      rgba(43, 42, 110, 0.38) 52%,
      rgba(43, 42, 110, 0.94) 100%
    );
    z-index: 2;
    pointer-events: none;
  }

  .nhv-section .nhv-level-content {
    position: relative;
    z-index: 3;
    width: 100%;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .nhv-section .nhv-level-title {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--nhv-white);
  }

  .nhv-section .nhv-level-subtitle {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.35;
    color: var(--nhv-white);
    margin-bottom: 6px;
  }

  .nhv-section .nhv-level-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 14px;
    background-color: var(--nhv-orange);
    color: var(--nhv-white);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .nhv-section .nhv-level-btn:hover {
    background-color: var(--nhv-orange-hover);
    transform: translateY(-1px);
  }

  .nhv-section .nhv-divider {
    width: 100%;
    max-width: 960px;
    height: 1px;
    background-color: var(--nhv-divider);
  }

  @media (max-width: 1024px) {
    .nhv-section {
      padding: 52px 20px 0;
    }

    .nhv-section .nhv-heading {
      font-size: 30px;
      margin-bottom: 36px;
    }

    .nhv-section .nhv-grid {
      grid-template-rows: 200px 200px;
      gap: 20px;
      margin-bottom: 52px;
    }

    .nhv-section .nhv-level-content {
      padding: 20px 22px;
    }

    .nhv-section .nhv-level-title {
      font-size: 21px;
    }
  }

  @media (max-width: 600px) {
    .nhv-section {
      padding: 44px 16px 0;
    }

    .nhv-section .nhv-heading {
      font-size: 24px;
      margin-bottom: 28px;
    }

    .nhv-section .nhv-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      gap: 18px;
      margin-bottom: 44px;
    }

    .nhv-section .nhv-level-card--basic,
    .nhv-section .nhv-level-card--intermediate,
    .nhv-section .nhv-level-card--advanced {
      grid-column: 1;
      grid-row: auto;
      min-height: 220px;
    }

    .nhv-section .nhv-level-content {
      padding: 20px;
    }

    .nhv-section .nhv-level-title {
      font-size: 20px;
    }
  }
</style>

    <div class="nhv-divider" aria-hidden="true"></div>
  </div>
</section>
